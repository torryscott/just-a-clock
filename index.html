<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just a Clock</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #000; --fg: #fff; --dim: #ccc; --quiet: #999; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body.idle { cursor: none; }
  #clock {
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #side { display: inline-block; margin-left: .15em; font-size: .35em; line-height: 1; color: var(--dim); }
  #side span { display: block; }
  #ampm { margin-bottom: .63em; font-size: .8em; }
  #controls {
    position: fixed;
    inset: auto 0 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    color: var(--quiet);
    transition: opacity .3s;
  }
  body.idle #controls { opacity: 0; pointer-events: none; }
  :fullscreen #hint { display: none; }
  #tools { display: flex; align-items: center; gap: 10px; }
  #tools button {
    height: 34px;
    padding: 0 12px;
    border: 1px solid #888;
    border-radius: 6px;
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  #tools button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #tools button[aria-expanded="true"] { border-color: var(--fg); }
  #color-row, #size-row { display: flex; align-items: center; gap: 8px; }
  #color-row[hidden], #size-row[hidden] { display: none; }
  #tools .swatch { width: 48px; padding: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  #tools .swatch[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 2px; }
  #size-slider { width: 180px; accent-color: var(--fg); }
  #size-value { min-width: 4ch; color: var(--fg); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="clock" role="timer"><span id="time"></span><span id="side"><span id="ampm"></span><span id="seconds"></span></span></div>
<div id="controls">
  <div id="tools">
    <button id="colors" type="button" aria-expanded="false" aria-controls="color-row">Colors</button>
    <button id="size" type="button" aria-expanded="false" aria-controls="size-row">Size</button>
    <div id="color-row" hidden role="group" aria-label="Clock colors"></div>
    <div id="size-row" hidden>
      <input id="size-slider" type="range" min="25" max="100" step="1" value="100" aria-label="Clock size, as a percentage of the largest that fits">
      <span id="size-value" aria-hidden="true">100%</span>
    </div>
  </div>
  <div id="hint">Click the clock for full screen</div>
</div>
<script>
const clock = document.getElementById("clock");
const timeEl = document.getElementById("time");
const ampmEl = document.getElementById("ampm");
const secondsEl = document.getElementById("seconds");
const hint = document.getElementById("hint");

// ---- Time ----
// The time comes from the computer's own clock, read fresh every tick, so it
// cannot drift. If that clock is wrong, sync() corrects it from the web server.
let offset = 0;
let timer;

const pad = n => String(n).padStart(2, "0");

function tick() {
  clearTimeout(timer);
  const now = Date.now() + offset;
  const d = new Date(now);
  timeEl.textContent = (d.getHours() % 12 || 12) + ":" + pad(d.getMinutes());
  ampmEl.textContent = d.getHours() < 12 ? "AM" : "PM";
  secondsEl.textContent = pad(d.getSeconds());
  timer = setTimeout(tick, 1000 - now % 1000);
}

// ---- Correcting a wrong computer clock ----
// GitHub Pages stamps every response with the current time in its Date header.
// That header only has one-second resolution, so a difference under two seconds
// is treated as noise and a correctly set computer clock is left alone. If the
// network is down or the samples disagree, nothing changes.
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function sample() {
  const sent = Date.now();
  const res = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
  const received = Date.now();
  const server = Date.parse(res.headers.get("date"));
  if (!res.ok || isNaN(server) || received - sent > 2000) return null;
  // The header drops the fraction of a second, so add back half a second on average.
  return server + 500 - (sent + received) / 2;
}

async function sync() {
  const samples = [];
  for (let i = 0; i < 5; i++) {
    try {
      const s = await sample();
      if (s !== null) samples.push(s);
    } catch {}
    await wait(700);
  }
  samples.sort((a, b) => a - b);
  if (samples.length < 3 || samples[samples.length - 1] - samples[0] > 2000) return;
  const median = samples[samples.length >> 1];
  if (Math.abs(median - offset) > 2000) {
    offset = median;
    tick();
  }
}

// ---- Saved settings ----
function remember(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {}
}

function recall(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}

// ---- Size ----
// Fit the widest possible time so the digits never change size during the day,
// then scale it by the slider: 100% is as big as fits on the screen.
const SIZE_KEY = "just-a-clock-size";
const sizeButton = document.getElementById("size");
const sizeRow = document.getElementById("size-row");
const sizeSlider = document.getElementById("size-slider");
const sizeValue = document.getElementById("size-value");
let sizePercent = 100;

function fit() {
  const time = timeEl.textContent;
  const ampm = ampmEl.textContent;
  const seconds = secondsEl.textContent;
  timeEl.textContent = "12:00";
  secondsEl.textContent = "00";
  clock.style.fontSize = "100px";
  let width = 0;
  let height = 0;
  for (const label of ["AM", "PM"]) {
    ampmEl.textContent = label;
    const box = clock.getBoundingClientRect();
    width = Math.max(width, box.width);
    height = Math.max(height, box.height);
  }
  const scale = Math.min(innerWidth * 0.94 / width, innerHeight * 0.9 / height);
  clock.style.fontSize = scale * sizePercent + "px";
  timeEl.textContent = time;
  ampmEl.textContent = ampm;
  secondsEl.textContent = seconds;
}

function setSize(percent) {
  // Nothing saved yet reads as null or "", which must mean 100%, not 0%.
  const n = percent === null || String(percent).trim() === "" ? 100 : Math.round(Number(percent));
  sizePercent = Number.isFinite(n) ? Math.min(100, Math.max(25, n)) : 100;
  sizeSlider.value = sizePercent;
  sizeValue.textContent = sizePercent + "%";
}

sizeButton.addEventListener("click", () => togglePopout(sizeButton, sizeRow, () => sizeSlider.focus()));

sizeSlider.addEventListener("input", () => {
  setSize(sizeSlider.value);
  fit();
});

sizeSlider.addEventListener("change", () => remember(SIZE_KEY, sizePercent));

setSize(recall(SIZE_KEY));

// ---- Keep the screen on ----
let lock;

async function keepAwake() {
  if (lock && !lock.released) return;
  try {
    lock = await navigator.wakeLock.request("screen");
  } catch {}
}

// ---- Colors ----
// The Colors button opens a row of four choices beside it.
const PALETTES = [
  { name: "White on black", bg: "#000000", fg: "#ffffff", dim: "#cccccc", quiet: "#999999" },
  { name: "Black on white", bg: "#ffffff", fg: "#000000", dim: "#333333", quiet: "#595959" },
  { name: "Yellow on black", bg: "#000000", fg: "#ffc400", dim: "#e0ac00", quiet: "#999999" },
  { name: "White on navy", bg: "#0b2a5b", fg: "#ffffff", dim: "#d6e0f0", quiet: "#b8c7e0" },
];
const COLORS_KEY = "just-a-clock-colors";
const colorsButton = document.getElementById("colors");
const colorRow = document.getElementById("color-row");

function setColors(palette) {
  const root = document.documentElement.style;
  for (const part of ["bg", "fg", "dim", "quiet"]) root.setProperty("--" + part, palette[part]);
  for (const button of colorRow.children) {
    button.setAttribute("aria-pressed", String(button.title === palette.name));
  }
}

for (const palette of PALETTES) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "swatch";
  button.textContent = "12";
  button.title = palette.name;
  button.setAttribute("aria-label", palette.name);
  button.style.background = palette.bg;
  button.style.color = palette.fg;
  button.addEventListener("click", () => {
    setColors(palette);
    remember(COLORS_KEY, palette.name);
  });
  colorRow.append(button);
}

const savedColors = recall(COLORS_KEY);
setColors(PALETTES.find(palette => palette.name === savedColors) || PALETTES[0]);

colorsButton.addEventListener("click", () => togglePopout(colorsButton, colorRow, () => {
  (colorRow.querySelector('[aria-pressed="true"]') || colorRow.firstElementChild).focus();
}));

// ---- Pop-out rows ----
// Colors and Size each open a row beside the buttons. Opening one closes the other.
function togglePopout(button, row, onOpen) {
  const open = row.hidden;
  for (const [b, r] of [[colorsButton, colorRow], [sizeButton, sizeRow]]) {
    r.hidden = true;
    b.setAttribute("aria-expanded", "false");
  }
  if (open) {
    row.hidden = false;
    button.setAttribute("aria-expanded", "true");
    onOpen();
  }
}

// ---- Full screen and cursor ----
if (!document.documentElement.requestFullscreen) hint.hidden = true;

addEventListener("click", event => {
  keepAwake();
  if (event.target.closest("button, #color-row, #size-row")) return;
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});

let idleTimer;

function showCursor() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
}

addEventListener("mousemove", showCursor);
addEventListener("keydown", showCursor);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  tick();
  keepAwake();
});

addEventListener("resize", fit);

tick();
fit();
showCursor();
keepAwake();
sync();
setInterval(sync, 5 * 60 * 1000);
</script>
</body>
</html>
